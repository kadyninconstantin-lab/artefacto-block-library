<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<!-- Artefacto Block: Contact Form — форма записи -->
<style>

    .af-form {
        --af-primary: #de6518;
        --af-primary-hover: #c55a15;
        --af-bg: #f4efe9;
        --af-card-bg: #ffffff;
        --af-text: #3b3b3b;
        --af-text-light: #4a4a4a;
        --af-border: #999999;
        --af-radius: 16px;
        --af-font-heading: 'Source Serif 4', 'Georgia', serif;
        --af-font-body: 'Manrope', 'Helvetica Neue', sans-serif;
        background: var(--af-bg);
        padding: clamp(56px, 10vw, 120px) clamp(16px, 4vw, 48px);
        font-family: var(--af-font-body);
        color: var(--af-text);
    }
    .af-form__inner {
        max-width: 560px;
        margin: 0 auto;
        background: var(--af-card-bg);
        border-radius: var(--af-radius);
        padding: clamp(28px, 4vw, 48px);
    }
    .af-form__heading {
        font-family: var(--af-font-heading);
        font-size: clamp(22px, 3vw, 32px);
        font-weight: 700;
        text-align: center;
        margin-bottom: clamp(24px, 4vw, 48px);
    }
    .af-form__sub {
        text-align: center;
        color: var(--af-text-light);
        font-size: clamp(16px, 1.4vw, 18px);
        margin-bottom: clamp(24px, 3vw, 32px);
    }
    .af-form__field {
        margin-bottom: clamp(12px, 2vw, 16px);
    }
    .af-form__label {
        display: block;
        font-size: clamp(16px, 1.3vw, 18px);
        font-weight: 600;
        margin-bottom: 6px;
    }
    .af-form__input,
    .af-form__select,
    .af-form__textarea {
        box-sizing: border-box;
        width: 100%;
        padding: clamp(10px, 1.5vw, 14px) clamp(12px, 2vw, 16px);
        border: 2px solid var(--af-border);
        border-radius: 10px;
        font-family: var(--af-font-body);
        font-size: clamp(18px, 1.4vw, 20px);
        color: var(--af-text);
        background: #fff;
        transition: border-color 0.2s;
        outline: none;
    }
    .af-form__input:focus,
    .af-form__select:focus,
    .af-form__textarea:focus {
        border-color: var(--af-primary);
    }
    .af-form__textarea { resize: vertical; min-height: 80px; }
    .af-form__btn {
    min-height: 48px;
        display: block;
        width: 100%;
        padding: clamp(14px, 2vw, 18px);
        border-radius: 50px;
        background: var(--af-primary);
        color: #fff;
        font-family: var(--af-font-body);
        font-size: clamp(18px, 1.5vw, 20px);
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: clamp(8px, 1.5vw, 12px);
    }
    .af-form__btn {
        box-shadow: 0 4px 14px rgba(222, 101, 24, 0.25);
    }

    .af-form__btn:hover {
        background: var(--af-primary-hover);
        transform: translateY(-3px);
        box-shadow: 0 8px 28px rgba(222, 101, 24, 0.4);
    }

    .af-form__btn:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(222, 101, 24, 0.2);
    }
    :focus-visible{outline:3px solid #de6518;outline-offset:3px;border-radius:4px;}
</style>

<div class="af-form" id="form">
    <div class="af-form__inner">
        <h2 class="af-form__heading">Sign up for the intensive</h2>
        <p class="af-form__sub">We'll reply within 1 hour</p>
        <form>
            <div class="af-form__field">
                <label class="af-form__label" for="af-name">Your name</label>
                <input type="text" id="af-name" class="af-form__input" placeholder="Name" required>
            </div>
            <div class="af-form__field">
                <label class="af-form__label" for="af-phone">Phone / Telegram</label>
                <input type="tel" id="af-phone" class="af-form__input" placeholder="+49 ..." required>
            </div>
            <div class="af-form__field">
                <label class="af-form__label" for="af-email">Email</label>
                <input type="email" id="af-email" class="af-form__input" placeholder="email@example.com" required>
            </div>
            <div class="af-form__field">
                <label class="af-form__label" for="af-plan">Plan</label>
                <select id="af-plan" class="af-form__select">
                    <option>Recording Only — €49</option>
                    <option>Live + Recording — €89</option>
                    <option>VIP Experience — €149</option>
                </select>
            </div>
            <div class="af-form__field">
                <label class="af-form__label" for="af-comment">Comment (optional)</label>
                <textarea id="af-comment" class="af-form__textarea" placeholder="Questions or notes"></textarea>
            </div>
            <button type="submit" class="af-form__btn">Submit</button>
        </form>
    </div>
</div>
